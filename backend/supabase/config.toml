# Supabase project config for the SteinWall backend (functions only need these settings).
# Webhooks and the public endpoints are called without a Supabase user session.
project_id = "steinwall"

[functions.stripe-webhook]
verify_jwt = false

[functions.checkout]
verify_jwt = false

[functions.license]
verify_jwt = false

[functions.license-refresh]
verify_jwt = false

[functions.telemetry]
verify_jwt = false
